name: CI

# Lint every PHP file and run the tests that can run without a live store.
#
# tests/run.php is a self-contained runner (WordPress and WooCommerce are
# stubbed) and pulls in every *-test.php file. tests/test-order-payload.php is
# NOT run here on purpose: it is a WP-CLI script that needs a real WooCommerce
# store (wp eval-file ...), as its own header explains.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP
        run: |
          find . -path ./dist -prune -o -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: php tests/run.php

      # The storefront's pure JS (no npm dependencies); the runner image ships Node.
      - name: Run JS tests
        run: |
          node --check assets/js/tack-quotes.js
          node tests/js/with-options.test.js

      - name: Build release artifact(s)
        run: bash scripts/package.sh dist

  # WordPress + WooCommerce coding standards (phpcs.xml.dist). The gate is zero
  # errors AND zero warnings: phpcs exits non-zero on either. The sniff set is
  # pinned by composer.lock so a WPCS release cannot change the verdict between
  # two runs of the same commit. These action majors each declare
  # `runs.using: node24` in their own action.yml (checked 2026-10-10:
  # actions/checkout@v5, shivammathur/setup-php@v2, actions/cache@v5); the
  # `test` job above is left on its existing pins.
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install coding standards (locked)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPCS
        run: vendor/bin/phpcs -q --report=summary
